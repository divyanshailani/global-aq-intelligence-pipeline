name: Global AQI Daily Pipeline

on:
  schedule:
    - cron: '43 5 * * *'
  workflow_dispatch:

# Database writes and frontend publication must never overlap with backfill.
concurrency:
  group: global-aqi-production-database
  cancel-in-progress: false

permissions:
  contents: read

env:
  POSTGRES_HOST: ${{ secrets.POSTGRES_HOST }}
  POSTGRES_PORT: ${{ secrets.POSTGRES_PORT }}
  POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
  POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
  POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
  OPENAQ_KEYS: ${{ secrets.OPENAQ_KEYS }}
  PYTHONUNBUFFERED: '1'

jobs:
  run-daily-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout pipeline
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: |
          set -Eeuo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Validate secrets and database connectivity
        run: |
          set -Eeuo pipefail
          required=(POSTGRES_HOST POSTGRES_PORT POSTGRES_USER POSTGRES_PASSWORD POSTGRES_DB OPENAQ_KEYS)
          for name in "${required[@]}"; do
            if [[ -z "${!name:-}" ]]; then
              echo "ERROR: $name is empty"
              exit 1
            fi
            echo "OK: $name is set"
          done

          python - <<'PY'
          import os
          import psycopg2

          conn = psycopg2.connect(
              host=os.environ["POSTGRES_HOST"].strip(),
              port=int(os.environ["POSTGRES_PORT"].strip()),
              user=os.environ["POSTGRES_USER"].strip(),
              password=os.environ["POSTGRES_PASSWORD"].strip(),
              dbname=os.environ["POSTGRES_DB"].strip(),
              connect_timeout=15,
              sslmode="require",
          )
          with conn:
              with conn.cursor() as cur:
                  cur.execute("SELECT 1, current_database(), now()")
                  result = cur.fetchone()
                  print(f"DB connected: database={result[1]}, server_time={result[2]}")
          PY

      - name: Incremental collection
        timeout-minutes: 22
        run: |
          set -Eeuo pipefail
          echo 'Starting incremental collection'
          echo '[COLLECT] hard budget: 20m; bounded HTTP request timeouts enabled'
          # Keep the whole public-path collection step within one hard budget.
          # Completed API chunks are checkpointed; the next scheduled run resumes
          # them. Retrying the entire collector here can consume 5 x 20 minutes
          # and repeatedly re-run slow S3 scans before ETL is reached.
          set +e
          timeout --signal=TERM --kill-after=60s 20m \
            python -u scripts/pipeline/run_daily_collector.py --incremental-only
          rc=$?
          set -e

          if [[ "$rc" -eq 124 ]]; then
            echo 'ERROR: incremental collection hit the 20-minute budget'
            echo 'Checkpointed progress will be resumed by the next scheduled run.'
            echo 'ETL/inference/publish are intentionally blocked because public-path freshness is incomplete.'
            exit 124
          elif [[ "$rc" -ne 0 ]]; then
            echo "ERROR: incremental collection failed with exit code $rc"
            exit "$rc"
          fi
          echo 'Incremental collection completed successfully'

      - name: ETL (retry transient database failures)
        # Weather enrichment can fan out into slow upstream calls; enforce a
        # whole-step ceiling so retries cannot consume the remaining job time.
        timeout-minutes: 3
        run: |
          set -Eeuo pipefail
          succeeded=0
          for attempt in 1 2 3; do
            echo "ETL attempt $attempt/3"
            if python -u scripts/pipeline/run_daily_etl.py --recent-days 5 --max-enrich 50; then
              echo "ETL succeeded on attempt $attempt"
              succeeded=1
              break
            fi
            echo "ETL attempt $attempt failed"
            if [[ "$attempt" -lt 3 ]]; then
              sleep 60
            fi
          done
          [[ "$succeeded" -eq 1 ]] || { echo 'ERROR: ETL failed after 3 attempts'; exit 1; }

      - name: Run V12 ONNX inference
        run: |
          set -Eeuo pipefail
          python -u scripts/pipeline/predict_v12_onnx.py

      - name: Validate predictions
        run: |
          set -Eeuo pipefail
          python -u scripts/pipeline/validate_predictions.py

      - name: Prepare frontend repository
        env:
          FRONTEND_PAT: ${{ secrets.FRONTEND_PAT }}
        run: |
          set -Eeuo pipefail
          [[ -n "${FRONTEND_PAT:-}" ]] || { echo 'ERROR: FRONTEND_PAT is empty'; exit 1; }
          git clone https://github.com/divyanshailani/global-aq-intelligence-web.git "$RUNNER_TEMP/global-aq-intelligence-web"
          cd "$RUNNER_TEMP/global-aq-intelligence-web"
          git config user.name 'Global AQI Bot'
          git config user.email 'bot@globalaqi.com'
          git remote set-url origin "https://x-access-token:${FRONTEND_PAT}@github.com/divyanshailani/global-aq-intelligence-web.git"

      - name: Publish generated site data
        env:
          FRONTEND_DIR: ${{ runner.temp }}/global-aq-intelligence-web
        run: |
          set -Eeuo pipefail
          shopt -s nullglob
          files=(site_data/*.json)
          [[ "${#files[@]}" -gt 0 ]] || { echo 'ERROR: no generated site_data JSON files'; exit 1; }
          mkdir -p "$FRONTEND_DIR/public/data"
          cp -f "${files[@]}" "$FRONTEND_DIR/public/data/"

          cd "$FRONTEND_DIR"
          git add public/data/*.json
          if git diff --cached --quiet; then
            echo 'No prediction changes to publish.'
            exit 0
          fi

          git commit -m "auto: daily V12 predictions $(date -u +%Y-%m-%d)"

          # Rebase after staging/committing, matching the proven local ordering.
          # Generated JSON is authoritative if another run changed the same file.
          for attempt in 1 2 3; do
            if git pull --rebase origin main; then
              break
            fi
            echo "Frontend rebase attempt $attempt failed"
            git rebase --abort 2>/dev/null || true
            git fetch origin main
            git reset --soft origin/main
            git add public/data/*.json
            git commit -m "auto: daily V12 predictions $(date -u +%Y-%m-%d)" || true
            [[ "$attempt" -lt 3 ]] && sleep 20
          done

          pushed=0
          for attempt in 1 2 3; do
            if git push origin main; then
              pushed=1
              break
            fi
            echo "Frontend push attempt $attempt failed; refreshing remote"
            git pull --rebase origin main || true
            [[ "$attempt" -lt 3 ]] && sleep 20
          done
          [[ "$pushed" -eq 1 ]] || { echo 'ERROR: frontend push failed after 3 attempts'; exit 1; }

          local_sha=$(git rev-parse HEAD)
          remote_sha=$(git ls-remote origin refs/heads/main | cut -f1)
          [[ -n "$remote_sha" && "$local_sha" == "$remote_sha" ]] || {
            echo "ERROR: remote verification failed (local=$local_sha remote=$remote_sha)"
            exit 1
          }
          echo "Frontend published and verified at $remote_sha"

      - name: Final database health check
        if: ${{ success() }}
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          import os
          import psycopg2
          conn = psycopg2.connect(
              host=os.environ["POSTGRES_HOST"].strip(),
              port=int(os.environ["POSTGRES_PORT"].strip()),
              user=os.environ["POSTGRES_USER"].strip(),
              password=os.environ["POSTGRES_PASSWORD"].strip(),
              dbname=os.environ["POSTGRES_DB"].strip(),
              connect_timeout=15,
              sslmode="require",
          )
          with conn:
              with conn.cursor() as cur:
                  cur.execute("SELECT 1")
                  assert cur.fetchone() == (1,)
          print("Final DB health check passed")
          PY

      - name: Write run summary
        if: ${{ always() }}
        run: |
          {
            echo '## Global AQI daily pipeline'
            echo
            echo "- Run: $GITHUB_RUN_ID"
            echo "- Result: ${{ job.status }}"
            echo "- Runner: $RUNNER_OS"
            echo '- Public path: collection → ETL (3 retries) → inference → validation → frontend publish'
            echo '- Historical backfill: intentionally separate; daily runner never blocks public data'
          } >> "$GITHUB_STEP_SUMMARY"
