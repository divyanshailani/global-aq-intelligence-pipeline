name: Global AQI Daily Pipeline

on:
  schedule:
    - cron: '43 5 * * *'
  workflow_dispatch:

# Database writes and frontend publication must never overlap with backfill.
concurrency:
  group: global-aqi-production-database
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

env:
  POSTGRES_HOST: ${{ secrets.POSTGRES_HOST }}
  POSTGRES_PORT: ${{ secrets.POSTGRES_PORT }}
  POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
  POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
  POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
  OPENAQ_KEYS: ${{ secrets.OPENAQ_KEYS }}
  PYTHONUNBUFFERED: '1'

jobs:
  run-daily-pipeline:
    runs-on: ubuntu-latest
    # Worst case under the current budgets: 32m collection + 34m ETL + 10m
    # inference + validation/publish/health. Steady state is ~23m. The job
    # ceiling must stay above the sum of step ceilings or it reproduces the
    # 2026-09-28 failure one level up: a slow-but-healthy pass killed by a
    # budget that assumed an average run.
    timeout-minutes: 115

    steps:
      - name: Checkout pipeline
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: |
          set -Eeuo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Validate secrets and database connectivity
        run: |
          set -Eeuo pipefail
          required=(POSTGRES_HOST POSTGRES_PORT POSTGRES_USER POSTGRES_PASSWORD POSTGRES_DB OPENAQ_KEYS)
          for name in "${required[@]}"; do
            if [[ -z "${!name:-}" ]]; then
              echo "ERROR: $name is empty"
              exit 1
            fi
            echo "OK: $name is set"
          done

          python - <<'PY'
          import os
          import psycopg2

          conn = psycopg2.connect(
              host=os.environ["POSTGRES_HOST"].strip(),
              port=int(os.environ["POSTGRES_PORT"].strip()),
              user=os.environ["POSTGRES_USER"].strip(),
              password=os.environ["POSTGRES_PASSWORD"].strip(),
              dbname=os.environ["POSTGRES_DB"].strip(),
              connect_timeout=15,
              sslmode="require",
          )
          with conn:
              with conn.cursor() as cur:
                  cur.execute("SELECT 1, current_database(), now()")
                  result = cur.fetchone()
                  print(f"DB connected: database={result[1]}, server_time={result[2]}")
          PY

      - name: Incremental collection
        timeout-minutes: 32
        run: |
          set -Eeuo pipefail
          echo 'Starting incremental collection'
          echo '[COLLECT] budget: 20m primary + 8m resume; bounded HTTP request timeouts enabled'
          # Completed API chunks are checkpointed, so a budget overrun is resumable
          # rather than restartable. Retrying the whole collector burns 20 minutes
          # per attempt re-running slow S3 scans; instead the primary pass gets 20
          # minutes and a single resume pass gets 8 more, which is enough to finish
          # the tail on a slow OpenAQ day without blocking the public path.
          run_pass() {
            local budget="$1"
            set +e
            timeout --signal=TERM --kill-after=60s "$budget" \
              python -u scripts/pipeline/run_daily_collector.py --incremental-only
            local rc=$?
            set -e
            return "$rc"
          }

          rc=0
          run_pass 20m || rc=$?

          if [[ "$rc" -eq 124 ]]; then
            echo 'WARNING: primary collection pass hit its 20-minute budget; resuming from checkpoint'
            rc=0
            run_pass 8m || rc=$?
          fi

          if [[ "$rc" -eq 124 ]]; then
            echo 'ERROR: incremental collection still incomplete after the resume pass'
            echo 'Checkpointed progress will be resumed by the next scheduled run.'
            echo 'ETL/inference/publish are intentionally blocked because public-path freshness is incomplete.'
            exit 124
          elif [[ "$rc" -ne 0 ]]; then
            echo "ERROR: incremental collection failed with exit code $rc"
            exit "$rc"
          fi
          echo 'Incremental collection completed successfully'

      - name: ETL (retry transient database failures)
        # Phase 1 bulk-loads and inserts ~1.8M rows over the remote database
        # connection; the prior 3-minute ceiling killed the insert mid-flight.
        # Phase 3 remains independently capped at 3 minutes in the ETL script.
        # Steady state is 11-15 minutes. On 2026-09-28 the step's old flat
        # 20-minute ceiling killed the run mid-pass (12:16:01->12:36:14,
        # exactly 20m) with zero of the 3 retry attempts ever running, while
        # the identical step six hours earlier took 14m40s. The ceiling now
        # lives on each ATTEMPT (25m, allowing Phase 4 / variable DB work to
        # finish under load); two full attempts plus one backoff fit the 55m
        # step ceiling. Retries restart the ETL from Phase 1, so keep the count
        # explicit and leave room for termination grace.
        timeout-minutes: 55
        run: |
          set -Eeuo pipefail
          succeeded=0
          for attempt in 1 2; do
            echo "ETL attempt $attempt/2"
            if timeout --signal=TERM --kill-after=60s 25m \
              python -u scripts/pipeline/run_daily_etl.py --recent-days 5 --max-enrich 5000; then
              echo "ETL succeeded on attempt $attempt"
              succeeded=1
              break
            fi
            echo "ETL attempt $attempt failed"
            if [[ "$attempt" -lt 2 ]]; then
              sleep 60
            fi
          done
          [[ "$succeeded" -eq 1 ]] || { echo 'ERROR: ETL failed after 2 attempts'; exit 1; }

      - name: Auto-repair recent weather gaps
        timeout-minutes: 12
        run: |
          set -Eeuo pipefail
          python -u scripts/pipeline/repair_recent_weather.py

      - name: Assert written data contract
        # Blocking, unlike the advisory final health check: every bug class
        # this gate covers (NULL country_code reaching the site, the ETL
        # silently predicting a June date as "today") got a write into the DB
        # and then every downstream step reported success. Failing HERE stops
        # inference and publish from propagating the bad rows; the ETL wrote
        # them, the site must not wear them.
        run: |
          set -Eeuo pipefail
          python -u scripts/pipeline/assert_data_contract.py

      - name: Run V12 ONNX inference
        timeout-minutes: 10
        run: |
          set -Eeuo pipefail
          test "$(find models/v12 -type f -name 'model.onnx' | wc -l)" -eq 16
          python -u scripts/pipeline/predict_v12_onnx.py

      - name: Validate predictions
        run: |
          set -Eeuo pipefail
          python -u scripts/pipeline/validate_predictions.py

      - name: Assert generated data is fresh
        # The site displays generated_at, which is always "now" — it says nothing
        # about whether the underlying observations advanced. Both are checked
        # here so the frontend can never advertise freshness it does not have.
        env:
          MAX_OBSERVATION_LAG_DAYS: '10'
        run: |
          set -Eeuo pipefail
          python -u scripts/pipeline/assert_site_data_fresh.py

      - name: Prepare frontend repository
        env:
          FRONTEND_PAT: ${{ secrets.FRONTEND_PAT }}
        run: |
          set -Eeuo pipefail
          [[ -n "${FRONTEND_PAT:-}" ]] || { echo 'ERROR: FRONTEND_PAT is empty'; exit 1; }
          git clone https://github.com/divyanshailani/global-aq-intelligence-web.git "$RUNNER_TEMP/global-aq-intelligence-web"
          cd "$RUNNER_TEMP/global-aq-intelligence-web"
          git config user.name 'Global AQI Bot'
          git config user.email 'bot@globalaqi.com'
          git remote set-url origin "https://x-access-token:${FRONTEND_PAT}@github.com/divyanshailani/global-aq-intelligence-web.git"

      - name: Measure database storage for the site
        # Requested by the maintaining agent so DB headroom is visible from the
        # published site. Deliberately NON-blocking, unlike the contract and
        # freshness gates above: this measures storage, which says nothing about
        # whether today's data is good - that is already enforced upstream. A
        # transient connection blip here must not cost the site its daily update
        # (same reasoning as the advisory "Final database health check").
        # Writes site_data/db_status.json, which the publish step's
        # site_data/*.json glob then carries to public/data/ automatically.
        continue-on-error: true
        run: |
          set -Eeuo pipefail
          python - <<'PYCODE'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          import psycopg2

          conn = psycopg2.connect(
              host=os.environ["POSTGRES_HOST"].strip(),
              # .get with a default, matching src/config.py: POSTGRES_PORT is a
              # CI secret but absent from a local .env, and this step should not
              # hard-fail where every other script works.
              port=int(os.environ.get("POSTGRES_PORT", "5432").strip()),
              user=os.environ["POSTGRES_USER"].strip(),
              password=os.environ["POSTGRES_PASSWORD"].strip(),
              dbname=os.environ["POSTGRES_DB"].strip(),
              connect_timeout=15,
              sslmode="require",
          )
          try:
              with conn.cursor() as cur:
                  # env var, not a literal: a db rename must not silently
                  # measure the wrong database (or none).
                  cur.execute("SELECT pg_database_size(%s)", (os.environ["POSTGRES_DB"].strip(),))
                  size_bytes = cur.fetchone()[0]
          finally:
              conn.close()

          cap_bytes = 32 * 1024 ** 3
          payload = {
              "size_bytes": size_bytes,
              "cap_bytes": cap_bytes,
              "pct_used": round(100 * size_bytes / cap_bytes, 2),
              "generated_at": datetime.now(timezone.utc).isoformat().replace("+00:00", "Z"),
          }
          output = Path("site_data/db_status.json")
          output.parent.mkdir(parents=True, exist_ok=True)
          output.write_text(json.dumps(payload, indent=2) + "\n", encoding="utf-8")
          print(f"Database storage: {payload['pct_used']:.2f}% of 32 GiB")
          PYCODE

      - name: Publish generated site data
        env:
          FRONTEND_DIR: ${{ runner.temp }}/global-aq-intelligence-web
        run: |
          set -Eeuo pipefail
          shopt -s nullglob
          files=(site_data/*.json)
          [[ "${#files[@]}" -gt 0 ]] || { echo 'ERROR: no generated site_data JSON files'; exit 1; }
          mkdir -p "$FRONTEND_DIR/public/data"
          cp -f "${files[@]}" "$FRONTEND_DIR/public/data/"

          cd "$FRONTEND_DIR"
          git add public/data/*.json
          if git diff --cached --quiet; then
            echo 'No prediction changes to publish.'
            exit 0
          fi

          git commit -m "auto: daily V12 predictions $(date -u +%Y-%m-%d)"

          # Rebase after staging/committing, matching the proven local ordering.
          # Generated JSON is authoritative if another run changed the same file.
          for attempt in 1 2 3; do
            if git pull --rebase origin main; then
              break
            fi
            echo "Frontend rebase attempt $attempt failed"
            git rebase --abort 2>/dev/null || true
            git fetch origin main
            git reset --soft origin/main
            git add public/data/*.json
            git commit -m "auto: daily V12 predictions $(date -u +%Y-%m-%d)" || true
            [[ "$attempt" -lt 3 ]] && sleep 20
          done

          pushed=0
          for attempt in 1 2 3; do
            if git push origin main; then
              pushed=1
              break
            fi
            echo "Frontend push attempt $attempt failed; refreshing remote"
            git pull --rebase origin main || true
            [[ "$attempt" -lt 3 ]] && sleep 20
          done
          [[ "$pushed" -eq 1 ]] || { echo 'ERROR: frontend push failed after 3 attempts'; exit 1; }

          local_sha=$(git rev-parse HEAD)
          remote_sha=$(git ls-remote origin refs/heads/main | cut -f1)
          [[ -n "$remote_sha" && "$local_sha" == "$remote_sha" ]] || {
            echo "ERROR: remote verification failed (local=$local_sha remote=$remote_sha)"
            exit 1
          }
          echo "Frontend published and verified at $remote_sha"

      - name: Final database health check
        # Advisory. Runs after the frontend is published, so a transient
        # connection blip here must not repaint a successful publish as a failure.
        if: ${{ success() }}
        continue-on-error: true
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          import os
          import psycopg2
          conn = psycopg2.connect(
              host=os.environ["POSTGRES_HOST"].strip(),
              port=int(os.environ["POSTGRES_PORT"].strip()),
              user=os.environ["POSTGRES_USER"].strip(),
              password=os.environ["POSTGRES_PASSWORD"].strip(),
              dbname=os.environ["POSTGRES_DB"].strip(),
              connect_timeout=15,
              sslmode="require",
          )
          with conn:
              with conn.cursor() as cur:
                  cur.execute("SELECT 1")
                  assert cur.fetchone() == (1,)
                  # Storage guard: Azure storage auto-grow is DISABLED on this
                  # server, so crossing the provisioned cap turns every write
                  # (collection, ETL, predictions) into an error. Azure's 7-day
                  # PITR cannot undo that; making the level visible on every run
                  # is the cheap half of the safety net while the measurement
                  # tables are archived and pruned.
                  cur.execute("SELECT pg_database_size(current_database())")
                  used_gib = cur.fetchone()[0] / 1024 ** 3
          cap_gib = float(os.environ.get("AZURE_STORAGE_GIB", "32"))
          pct = 100 * used_gib / cap_gib
          print(f"Database storage: {used_gib:.2f} GiB of {cap_gib:.0f} GiB ({pct:.0f}%)")
          if pct >= 85:
              print(
                  f"::warning::Database storage is {pct:.0f}% of the {cap_gib:.0f} GiB "
                  f"provisioned cap and auto-grow is off. Archive and prune the "
                  f"measurement tables (clean_measurements is the bulk)."
              )
          print("Final DB health check passed")
          PY

      - name: Write run summary
        if: ${{ always() }}
        run: |
          {
            echo '## Global AQI daily pipeline'
            echo
            echo "- Run: $GITHUB_RUN_ID"
            echo "- Result: ${{ job.status }}"
            echo "- Runner: $RUNNER_OS"
            echo '- Public path: collection → ETL (3 retries) → inference → validation → frontend publish'
            echo '- Historical backfill: intentionally separate; daily runner never blocks public data'
            # Include drift warnings from accuracy.json if available
            if [[ -f site_data/accuracy.json ]]; then
              drift=$(jq -r '.drift_warnings // [] | join("\\n")' site_data/accuracy.json 2>/dev/null)
              if [[ -n "$drift" ]]; then
                echo
                echo '### ⚠️ Model Drift Warnings'
                echo "$drift"
              fi
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Notify on failure
        if: ${{ failure() }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -Euo pipefail
          echo "::error::Global AQI Daily Pipeline failed (run $GITHUB_RUN_ID)"

          if ! gh label list --repo "$GITHUB_REPOSITORY" --search pipeline-failure --json name --jq '.[].name' | grep -qx 'pipeline-failure'; then
            gh label create pipeline-failure --repo "$GITHUB_REPOSITORY" \
              --color b60205 \
              --description 'Autonomous daily pipeline failed and needs human attention' || true
          fi

          run_url="https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          existing=$(gh issue list --repo "$GITHUB_REPOSITORY" --label pipeline-failure --state open --json number --jq 'length' || echo 0)
          if [[ "$existing" -gt 0 ]]; then
            issue_num=$(gh issue list --repo "$GITHUB_REPOSITORY" --label pipeline-failure --state open --json number --jq '.[0].number')
            gh issue comment "$issue_num" --repo "$GITHUB_REPOSITORY" \
              --body "Failed again on $(date -u +%Y-%m-%d) — [run $GITHUB_RUN_ID]($run_url)" || true
          else
            gh issue create --repo "$GITHUB_REPOSITORY" \
              --title "🚨 Daily pipeline failed — $(date -u +%Y-%m-%d)" \
              --label pipeline-failure \
              --body "$(printf 'The scheduled daily pipeline failed.\n\n- Run: [%s](%s)\n- Branch: %s\n- Time: %s\n\nCheck which step failed. Post-publish steps are advisory (`continue-on-error`), so a red run here means the public path itself broke: collection budget, ETL, inference, the freshness assertion, or the frontend push.\n\nClose this issue once the next run is green.' "$GITHUB_RUN_ID" "$run_url" "$GITHUB_REF_NAME" "$(date -u +%Y-%m-%dT%H:%M:%SZ)")" || true
          fi

          exit 1

      - name: Check persistent drift and open issue
        # Advisory only. This runs after the frontend is already published, so a
        # failure here previously marked the whole run red while the public site
        # was correctly updated (2026-08-19 and 2026-08-20: the `model-drift`
        # label did not exist, so `gh issue create --label` exited 1).
        if: ${{ success() }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -Euo pipefail
          if [[ ! -f site_data/accuracy.json ]]; then
            echo "No accuracy.json — skipping drift check"
            exit 0
          fi

          drift=$(jq -r '.drift_warnings // [] | length' site_data/accuracy.json)
          if [[ "$drift" -eq 0 ]]; then
            echo "No drift warnings today"
            exit 0
          fi

          warnings=$(jq -r '.drift_warnings | join("\n")' site_data/accuracy.json)
          echo "Drift warnings detected:"
          echo "$warnings"

          # Self-heal the label so a fresh clone of this repo does not fail here.
          if ! gh label list --repo "$GITHUB_REPOSITORY" --search model-drift --json name --jq '.[].name' | grep -qx 'model-drift'; then
            echo "Creating missing 'model-drift' label"
            gh label create model-drift --repo "$GITHUB_REPOSITORY" \
              --color d93f0b \
              --description 'Live MAE exceeded test MAE baseline; retraining may be needed' || true
          fi

          existing=$(gh issue list --repo "$GITHUB_REPOSITORY" --label "model-drift" --state open --json number --jq 'length' || echo 0)
          if [[ "$existing" -gt 0 ]]; then
            echo "Open drift issue already exists — commenting with today's status"
            issue_num=$(gh issue list --repo "$GITHUB_REPOSITORY" --label "model-drift" --state open --json number --jq '.[0].number')
            gh issue comment "$issue_num" --repo "$GITHUB_REPOSITORY" --body "$(printf '**Drift still active** — %s\n\n```\n%s\n```\n\n[Run %s](%s)' "$(date -u +%Y-%m-%d)" "$warnings" "$GITHUB_RUN_ID" "https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID")"
          else
            echo "No open drift issue — creating one"
            gh issue create --repo "$GITHUB_REPOSITORY" \
              --title "⚠️ Model Drift Detected — retraining may be needed" \
              --label "model-drift" \
              --body "$(printf '## Model Drift Warnings\n\n```\n%s\n```\n\nDetected on %s via [run %s](https://github.com/%s/actions/runs/%s).\n\n## Action Required\n\n- [ ] Investigate root cause (feature shift, station mix change, seasonal bias)\n- [ ] Check if drift persists for 7+ consecutive days\n- [ ] If persistent, retrain V12 models with recent data\n- [ ] Export new ONNX models and deploy to `models/v12/`\n\n## Drift Detection Criteria\n\nDrift is flagged when live MAE > 1.5× test MAE baseline for any country.' "$warnings" "$(date -u +%Y-%m-%d)" "$GITHUB_RUN_ID" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID")"
          fi
