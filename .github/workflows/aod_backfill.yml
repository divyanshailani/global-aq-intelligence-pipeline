name: Global AQI AOD Backfill

# Closes AOD holes in daily_features. Aerosol optical depth comes from the
# Open-Meteo air-quality host, whose free-tier budget is a small number of
# REQUESTS per hour per IP (measured 2026-09-28: ~4-6, unchanged whether each
# call covers 1 day or 14) and which does not recover within minutes - six
# calls spaced 75s apart were all rejected.
#
# Prefer the local loop for this host: GitHub runner IPs are shared and almost
# always already exhausted (one 46-window chunk spent 24 minutes on 429s and
# filled nothing), while a home IP answers a 200-location call in ~1.6s.
# scripts/operations/aod_fill_loop.sh drives that loop; it fills whatever each
# hour's budget allows and resumes automatically.
#
# This workflow is kept for the case where the runner's IP happens to be clean.
# Weather columns are left untouched: run the script locally with --skip-aod.
#
# Run manually with the date range that needs filling (the script is resumable
# and only fetches rows still missing AOD). A multi-week hole needs several
# dispatches: each run fills what the budget allows, stops on its own circuit
# breaker, and the next run resumes from what is still NULL.

on:
  workflow_dispatch:
    inputs:
      start:
        description: 'First date to fill (YYYY-MM-DD)'
        required: true
        default: '2026-08-09'
      end:
        description: 'Last date to fill (YYYY-MM-DD)'
        required: true
        default: '2026-09-24'

# Share the database lock with the daily job; backfill must never mutate the
# same production tables while the public pipeline is running.
concurrency:
  group: global-aqi-production-database
  cancel-in-progress: false

permissions:
  contents: read

env:
  POSTGRES_HOST: ${{ secrets.POSTGRES_HOST }}
  POSTGRES_PORT: ${{ secrets.POSTGRES_PORT }}
  POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
  POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
  POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
  OPENAQ_KEYS: ${{ secrets.OPENAQ_KEYS }}
  PYTHONUNBUFFERED: '1'

jobs:
  aod-backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      # One runner = one egress IP = its own daily allowance on the
      # air-quality host, so shards add throughput instead of queueing behind a
      # single budget. Kept at 4 because the concurrent get_missing queries hit
      # a 1-vCore production database; raise only if the DB stays responsive.
      max-parallel: 4
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - name: Checkout pipeline
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: |
          set -Eeuo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Backfill AOD
        run: |
          set -Eeuo pipefail
          python -u scripts/operations/backfill_weather_batch.py \
            --start "${{ inputs.start }}" \
            --end "${{ inputs.end }}" \
            --skip-weather \
            --aod-max-failures 1 \
            --shard "${{ matrix.shard }}/4"
